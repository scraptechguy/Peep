name: iOS Build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: macos-latest               # macos-latest now includes Xcode 16 on GitHub-hosted runners
    steps:
      - uses: actions/checkout@v3

      - name: Select Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.0.0'        # force the runner to use Xcode 16

      - name: Install Dependencies
        run: |
          bundle install
          bundle exec pod install

      - name: Build & Test
        run: |
          xcodebuild clean build \
            -project MyApp.xcodeproj \
            -scheme MyApp \
            -destination 'platform=iOS Simulator,name=iPhone 14' \
            ONLY_ACTIVE_ARCH=YES
