name: iOS starter workflow

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build & Test on iOS Simulator
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Xcode 16
        uses: apple/actions/setup-xcode@v4
        with:
          xcode-version: '16.0'

      - name: Discover Default Scheme
        id: set-scheme
        run: |
          # grab the first *scheme* from xcodebuild -list -json
          SCHEME=$(xcodebuild -list -json \
            | jq -r '.project.schemes[0]')
          echo "Using scheme: $SCHEME"
          echo "::set-output name=scheme::$SCHEME"

      - name: Build for testing
        env:
          SCHEME: ${{ steps.set-scheme.outputs.scheme }}
        run: |
          DEVICE=$(xcrun simctl list devices available \
            | grep -oE 'iPhone.*?(?= \\()' \
            | head -1)
          xcodebuild clean build-for-testing \
            -scheme "$SCHEME" \
            -workspace "$(ls *.xcworkspace || true)" \
            -project "$(ls *.xcodeproj || true)" \
            -destination "platform=iOS Simulator,name=$DEVICE"

      - name: Run tests
        env:
          SCHEME: ${{ steps.set-scheme.outputs.scheme }}
        run: |
          DEVICE=$(xcrun simctl list devices available \
            | grep -oE 'iPhone.*?(?= \\()' \
            | head -1)
          xcodebuild test-without-building \
            -scheme "$SCHEME" \
            -workspace "$(ls *.xcworkspace || true)" \
            -project "$(ls *.xcodeproj || true)" \
            -destination "platform=iOS Simulator,name=$DEVICE"
